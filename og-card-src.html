<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: radial-gradient(120% 140% at 50% 0%, #1b5e3a 0%, #134529 55%, #0e3621 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .mascot { width: 300px; height: auto; }
  .wordmark {
    margin-top: 18px;
    font-size: 92px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1;
    color: #ecf5ef;
  }
  .tagline {
    margin-top: 20px;
    font-size: 36px;
    font-weight: 500;
    color: #d4e9d9;
    letter-spacing: -0.01em;
  }
  .footnote {
    margin-top: 26px;
    font-size: 22px;
    font-weight: 400;
    color: #80b893;
    max-width: 760px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="mascot" src="retriever-mascot.webp" alt="">
    <div class="wordmark">Retriever</div>
    <div class="tagline">Helping grad students save thousands*</div>
    <div class="footnote">*Modeled savings. Not tax advice.</div>
  </div>
</body>
</html>
