<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold-200: #EDCC7A;
    --gold-300: #D4A843;
    --gold-400: #B8882A;
    --gold-500: #8C6318;
    --cream: #FEFBF4;
    --brown-dark: #3D2B0E;
    --brown-mid: #6B4A1F;
    --text-muted: #8C7B5E;
    --white: #FFFFFF;
  }

  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,168,67,0.14) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 100%, rgba(184,136,42,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 560px;
    width: 100%;
    animation: fadeUp 0.7s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dog-wrap {
    margin-bottom: 1.2rem;
    animation: fadeUp 0.7s ease 0.1s both;
    border-radius: 16px;
    overflow: hidden;
    width: 100%;
    max-width: 210px;
  }

  .dog-wrap img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 16px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.9rem;
    animation: fadeUp 0.7s ease 0.2s both;
  }

  .wordmark {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 700;
    color: var(--brown-dark);
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .wordmark .accent { color: var(--brown-dark); }

  .tagline {
    font-size: 1.15rem;
    font-weight: 400;
    color: var(--brown-mid);
    margin-bottom: 0.45rem;
    animation: fadeUp 0.7s ease 0.3s both;
  }

  .savings {
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--gold-500);
    margin-bottom: 1.4rem;
    animation: fadeUp 0.7s ease 0.32s both;
  }

  .coming-soon {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    margin-bottom: 0.45rem;
    animation: fadeUp 0.7s ease 0.37s both;
  }

  .divider {
    width: 36px;
    height: 2px;
    background: var(--gold-200);
    border-radius: 2px;
    margin: 0 auto 1rem;
    animation: fadeUp 0.7s ease 0.42s both;
  }

  .value-prop {
    font-size: 0.88rem;
    color: var(--text-muted);
    font-weight: 400;
    margin-bottom: 1rem;
    animation: fadeUp 0.7s ease 0.47s both;
  }

  .form-wrap {
    width: 100%;
    max-width: 400px;
    animation: fadeUp 0.7s ease 0.52s both;
  }

  .input-row {
    display: flex;
    width: 100%;
    border-radius: 50px;
    overflow: hidden;
    border: 1.5px solid var(--gold-200);
    background: var(--white);
    box-shadow: 0 2px 18px rgba(140, 99, 24, 0.09);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-row:focus-within {
    border-color: var(--gold-300);
    box-shadow: 0 2px 22px rgba(140, 99, 24, 0.16);
  }

  .email-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 0.85rem 1.2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    color: var(--brown-dark);
  }

  .email-input::placeholder { color: var(--text-muted); }

  .submit-btn {
    border: none;
    background: var(--gold-300);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 0.85rem 1.4rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
  }

  .submit-btn:hover { background: var(--gold-400); }
  .submit-btn:active { transform: scale(0.98); }

  .disclaimer {
    font-size: 0.71rem;
    color: var(--text-muted);
    margin-top: 0.7rem;
    letter-spacing: 0.01em;
  }

  .success-msg {
    display: none;
    font-size: 0.92rem;
    color: var(--gold-500);
    font-weight: 500;
    padding: 0.9rem;
    animation: fadeUp 0.4s ease both;
  }
</style>
</head>

    <h1 class="wordmark">Ret<span class="accent">r</span>iever</h1>
  </div>

  
  <p class="tagline">Graduate students: stop overpaying taxes.</p>
  <p class="savings">Projected to save the average student $2k – $5k.</p>

  <div class="divider"></div>

  <p class="coming-soon">Coming Summer 2026</p>
  <p class="value-prop">Be the first to know when we launch.</p>

  <div class="form-wrap">
    <div class="input-row" id="formRow">
      <input class="email-input" type="email" id="emailInput" name="email" placeholder="your@email.com" data-fs-field />
      <button class="submit-btn" id="submitBtn" data-fs-submit-btn onclick="handleSubmit()">Get updates</button>
    </div>
    <div class="success-msg" id="successMsg">You're on the list. We'll be in touch.</div>
    <div class="success-msg" id="errorMsg" style="color:#E24B4A;">Something went wrong. Please try again.</div>
  </div>

</div>

<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>

<script>
  // Track first time user starts typing in email field (only once per page load)
  let typingTracked = false;
  document.getElementById('emailInput').addEventListener('input', () => {
    if (!typingTracked && window.umami) {
      window.umami.track('email-typing-started');
      typingTracked = true;
    }
  });

  function handleSubmit() {
    const input = document.getElementById('emailInput');
    const val = input.value.trim();

    if (window.umami) window.umami.track('signup-submit-attempt');

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
      input.style.outline = '2px solid #E24B4A';
      input.focus();
      setTimeout(() => { input.style.outline = ''; }, 1500);
      if (window.umami) window.umami.track('signup-validation-error');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    fetch('https://formspree.io/f/mykoyeey', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: val })
    })
    .then(res => {
      if (res.ok) {
        document.getElementById('formRow').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
        if (window.umami) window.umami.track('signup-success');
      } else {
        btn.disabled = false;
        btn.textContent = 'Get updates';
        document.getElementById('errorMsg').style.display = 'block';
        if (window.umami) window.umami.track('signup-server-error');
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = 'Get updates';
      document.getElementById('errorMsg').style.display = 'block';
      if (window.umami) window.umami.track('signup-network-error');
    });
  }

  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });
</script>
